name: CI

# What a green tick here means, and what it does not.
#
# MEANS: the code type-checks, passes lint across the WHOLE repo (including
# scripts/ and e2e/, which Vercel's build never compiles), and 246 of the 292
# logic suites pass.
#
# DOES NOT MEAN:
#   * It builds. There is no `npm run build` step, deliberately — Vercel already
#     runs `next build --turbopack` on every push to every branch, with type
#     errors left enabled. Repeating it here costs ~4 minutes and a reachable
#     database for no new information.
#   * The e2e suite ran. It needs a seeded database and a booted server. Browser
#     coverage against the deployed preview arrives in Phase 4.
#   * All 292 suites ran. 46 cannot pass on a runner today; every one is listed
#     with its reason in .github/scripts/run-test-suites.sh. Phase 2 revives most
#     of them by giving CI a throwaway database.
#
# Full explanation, written for someone who has not set up CI before:
#   docs/dev-tooling/ci.md
# Design and phase plan:
#   docs/superpowers/specs/2026-09-04-ci-pipeline-design.md

on:
  # Every PR, on every push to it.
  pull_request:
  # Plus the two branches that deploy somewhere real. `main` is production;
  # `staging` is a deployed environment (docs/e2e/how-to-run.md). Pushes to a
  # feature branch with no open PR are deliberately NOT covered — open a PR.
  #
  # Listing branches here is what stops the double run: previously `on: push`
  # and `on: pull_request` both fired unfiltered, landing in different
  # concurrency groups (refs/heads/x vs refs/pull/N/merge), so every PR ran the
  # whole pipeline twice.
  push:
    branches: [main, staging]

# github.ref is already per-PR on pull_request (refs/pull/N/merge, stable across
# re-pushes) and per-branch on push. Do not "improve" this to head_ref — that
# collapses per-PR isolation into per-branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# An explicit block sets every unlisted scope to none. Without this the job
# inherits the repo-default token scope, which is far wider than it needs.
permissions:
  contents: read

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # package.json engines.node is "22.x". There is no .nvmrc in this repo.
          node-version: '22'
          cache: npm

      # ci, not install: installs exactly what package-lock.json pins, and fails
      # if the lockfile and package.json have drifted apart.
      - name: Install
        run: npm ci

      # THE FIX THAT MADE THIS WORKFLOW PASS FOR THE FIRST TIME.
      #
      # next-env.d.ts is gitignored (.gitignore:68) because Next regenerates it
      # on every build. It is also the only supplier of next/image-types/global,
      # which is what teaches tsc to read a `.webp` import. On a fresh checkout
      # that file does not exist, so tsc reported 9 TS2307 errors on .webp
      # imports and this workflow failed 108 times in a row.
      #
      # Vercel never hit it because `next build` writes the file itself — which
      # is exactly why the breakage stayed invisible for sixteen days.
      #
      # `next typegen` is Next's own supported command for this and takes ~4s.
      # Do not replace it by committing next-env.d.ts: it would go stale against
      # .next/types/routes.d.ts, which this same step generates.
      - name: Generate Next type definitions
        run: npx next typegen

      - name: Type check
        run: npm run type-check

      # Runs even when type-check failed, so one red step cannot hide the other.
      # Note this lints the whole repo (~2.7k files); Vercel's build lints src/**
      # only, and that delta is the reason this step earns its place.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

  # Consistency checks: cheap, need no services, and each catches a class of defect
  # that is otherwise SILENT — it ships, looks fine in review, and surfaces in
  # production or not at all.
  drift:
    name: drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Nine files under src/generated/ are committed AND machine-generated from
      # images, videos and the partner spreadsheet. Vercel regenerates them on every
      # deploy but never compares them to what is committed — so a PR that adds a
      # video without re-running the generator looks correct on the preview while the
      # committed manifest the tests import is stale. Regenerating and diffing is the
      # only thing that notices. Takes ~4s and needs no env.
      - name: Generated files match their inputs
        run: |
          npm run prebuild
          if ! git diff --exit-code --stat src/generated/; then
            echo ""
            echo "The files above are generated from inputs you changed, but the committed"
            echo "copies were not regenerated. Run 'npm run prebuild' and commit the result."
            exit 1
          fi

      # .env.example is the single source of truth for WHICH vars exist (CLAUDE.md §9)
      # and there is no runtime validation, so an unregistered var means production
      # silently reads `undefined`. Checks code reads against the registry; needs no
      # .env.local, which is why it can run here at all.
      - name: Env registry
        run: npm run check:env:registry

      # This repo has no test runner — a *.test.ts with no `test:*` script never runs
      # anywhere and nothing says so. It looks like coverage in review.
      - name: Every test file is wired to a script
        run: npm run check:test-scripts

      # A Norm route with no registry entry is a runtime failure that tsc, next build
      # AND regenerate-and-diff all miss, because the manifest is generated FROM the
      # registry and so still matches itself. CLAUDE.md rule 10.
      - name: Norm route/registry parity
        run: npm run check:norm-parity

      # Pure filesystem check that every expected landing hero asset is present.
      - name: Landing assets
        run: npm run check:promo-landing-assets

  # Reads the DEPLOYED preview with a real browser. This is the only automated defence
  # of the rule-11 free-entry wording (CLAUDE.md §11) outside Cobber's FAQ corpus.
  #
  # ADVISORY BY DESIGN — never add this to branch protection. It depends on a Vercel
  # deployment existing, and a required check that never reports (deployment skipped,
  # cancelled, or a fork PR) leaves the PR permanently unmergeable. `continue-on-error`
  # keeps the job's own result visible while the workflow stays green.
  #
  # Safe to run: DJ confirmed 2026-09-04 that Preview deployments read the DEV database,
  # not production — verified independently by comparing connection strings, which point
  # at different Atlas clusters. EXTERNAL mode is read-only regardless: e2e/run.ts:244
  # routes to runExternal() before any DB wipe/seed or server boot, and hard-excludes
  # @purchase and @admin.
  preview:
    name: preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      # An explicit permissions block sets every unlisted scope to none, and finding the
      # preview URL needs to read the deployment the Vercel integration created.
      deployments: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # `npm ci` installs NO browsers — all three playwright packages have
      # hasInstallScript:false. Cache on the resolved version so a playwright bump
      # invalidates it rather than silently reusing a mismatched build (a local run hit
      # exactly that: "Executable doesn't exist at …chromium_headless_shell-1228").
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # chromium only. chromium-desktop AND mobile-chrome both run on it, and mobile
      # coverage is not optional here: the rule-11 breach this job exists to catch sat
      # inside `lg:hidden` and was invisible at a desktop viewport. mobile-safari would
      # additionally need webkit, which is a much larger download for a third viewport.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Vercel publishes a GitHub Deployment per push. Poll for one whose status is
      # success and take its environment_url.
      # Use pull_request.head.sha, NOT github.sha — on a pull_request event github.sha
      # is the ephemeral merge commit, which Vercel never deploys and which therefore
      # never matches.
      - name: Wait for the Vercel preview
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          for attempt in $(seq 1 60); do
            ids=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                       -H "Accept: application/vnd.github+json" \
                       "${api}/deployments?sha=${SHA}&per_page=100" | jq -r '.[].id')
            for id in $ids; do
              url=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                         -H "Accept: application/vnd.github+json" \
                         "${api}/deployments/${id}/statuses?per_page=100" \
                    | jq -r 'map(select(.state == "success")) | .[0].environment_url // empty')
              if [ -n "$url" ] && [ "$url" != "null" ]; then
                echo "url=$url" >> "$GITHUB_OUTPUT"
                echo "preview ready: $url"
                exit 0
              fi
            done
            echo "attempt ${attempt}/60 — no successful preview deployment yet for ${SHA}"
            sleep 15
          done
          echo "No successful Vercel preview deployment for ${SHA} after 15 minutes." >&2
          echo "This job does NOT pass by default — a preview that was never scanned is not a clean scan." >&2
          exit 1

      # EXTERNAL mode: no database, no Stripe, no secrets, no server boot. It reads
      # whatever is deployed, so it can legitimately flag copy this PR did not touch —
      # that is the accepted cost of scanning the real deployed build. Re-run once the
      # offending copy is fixed on the branch it came from.
      - name: Legal-copy + smoke scan against the preview
        env:
          E2E_TARGET_URL: ${{ steps.deployment.outputs.url }}
        run: npx tsx e2e/run.ts --grep @smoke --project chromium-desktop --project mobile-chrome

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-e2e-report
          path: |
            e2e-artifacts/report
            e2e-artifacts/test-results
          retention-days: 7
          if-no-files-found: ignore

  suites:
    name: suites
    runs-on: ubuntu-latest
    # Measured at 417s on a Windows dev machine for all 292; 246 on Linux should
    # sit well under this. A hang is the real risk being capped here — no suite
    # sets its own timeout and 33 of them contain http(s) URLs.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # A throwaway MongoDB that lives and dies with this run. It holds nothing,
      # is reachable only from this machine, and revives 43 suites that cannot
      # run without a database — the webhook queue, renewal-grant reconciler and
      # shop entry-grant paths among them.
      #
      # Started with `docker run` rather than a `services:` block on purpose:
      # service containers cannot override the image command, and we must pass
      # `--replSet`. Transactions require a replica set, and `migrate:create-norm`
      # below uses one — on a standalone node it dies with
      # "Transaction numbers are only allowed on a replica set member or mongos".
      # Production is a 3-node set, so this is also the closer match.
      #
      # Pinned to 8.0 because production is 8.0.30; the floating `mongo:8` tag
      # resolves to 8.3.x, and testing against a server NEWER than production can
      # pass on behaviour production does not have.
      - name: Start MongoDB
        run: |
          docker run -d --name ci-mongo -p 27017:27017 mongo:8.0 --replSet rs0
          for i in $(seq 1 60); do
            docker exec ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec ci-mongo mongosh --quiet --eval 'rs.initiate()'
          for i in $(seq 1 60); do
            [ "$(docker exec ci-mongo mongosh --quiet --eval 'try{rs.status().myState}catch(e){0}' | tr -d '\r')" = "1" ] && break
            sleep 1
          done
          docker exec ci-mongo mongosh --quiet --eval 'print("replica set ready, myState=" + rs.status().myState)'

      # Most suites build and tear down their own fixtures. A few assume a LIVE
      # major draw already exists and mutate it, undoing the change in `finally`.
      # A developer's database always has one; an empty container does not, and
      # those suites fail on `no_target_draw` — nothing to do with what they test.
      # Measured: exactly 3 suites need the draw, 1 needs the Norm role + user.
      - name: Seed fixtures
        env:
          # directConnection=true is REQUIRED. A single-node replica set advertises
          # the container's own hostname, which nothing outside the container can
          # resolve; without this the driver hangs on topology discovery.
          MONGODB_URI: mongodb://localhost:27017/toolsaustralia-ci?directConnection=true
        run: |
          npm run seed:ci-fixtures
          npm run migrate:create-norm

      # The skip table, the integrity guards and the runner all live in the
      # script so you can run them locally:
      #   bash .github/scripts/run-test-suites.sh --list
      #   bash .github/scripts/run-test-suites.sh
      # Reproducing a red CI should never require pushing.
      - name: Test suites
        env:
          MONGODB_URI: mongodb://localhost:27017/toolsaustralia-ci?directConnection=true
          # A SEPARATE database, and its whole connection string must match /e2e/i:
          # two shop suites refuse to run otherwise, which is their guard against
          # ever touching real data. Deliberately not in .env.example — it is
          # LOCAL_ONLY (scripts/check-env.mjs).
          E2E_MONGODB_URI: mongodb://localhost:27017/toolsaustralia-e2e?directConnection=true
          # Placeholders, not secrets. src/lib/stripe.ts and src/lib/auth.ts throw at
          # MODULE SCOPE when these are absent, so the suites die at import without
          # ever making a call. Presence is what matters, not validity.
          # auth.ts gates on all five; NEVER set any of them to "" — its `!value`
          # test treats empty as missing, and next-auth's parseUrl throws on
          # NEXTAUTH_URL='' with a misleading "Invalid URL".
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          NEXTAUTH_SECRET: ci-not-a-secret
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
        run: bash .github/scripts/run-test-suites.sh
